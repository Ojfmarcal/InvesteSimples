name: Atualizar cotações

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar cotações na Brapi
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 scripts/update_prices.py
      - name: Publicar mudanças
        run: |
          git config user.name "investe-simples-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data companies.json
          git diff --cached --quiet || (git commit -m "Atualiza cotações" && git push)
